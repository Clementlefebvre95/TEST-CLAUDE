<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --pink:#ff2d55;--pink-l:#ff6b81;--pink-bg:#fff0f3;--pink-mid:#ffe0e8;
  --text:#2d1b20;--text2:#8c6470;--text3:#c4a0ac;
  --white:#ffffff;
  --safe-b:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;background:var(--pink-bg);font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;}

/* ── LOGIN ── */
#login-screen{
  position:fixed;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--pink-bg);
  padding:2rem 1.5rem;
  transition:opacity .5s ease, transform .5s ease;
}
#login-screen.hidden{opacity:0;pointer-events:none;transform:scale(1.04);}

/* LOGO SVG COEUR */
.logo-wrap{
  margin-bottom:20px;
  animation:heartbeat 1.6s ease-in-out infinite;
}
@keyframes heartbeat{
  0%,100%{transform:scale(1);}
  14%{transform:scale(1.12);}
  28%{transform:scale(1);}
  42%{transform:scale(1.08);}
  56%{transform:scale(1);}
}
.logo-wrap svg{
  width:100px;height:100px;
  filter:drop-shadow(0 4px 16px rgba(255,45,85,0.35));
}

.login-title{
  font-family:'Playfair Display',serif;
  font-size:46px;
  color:var(--text);
  letter-spacing:2px;
  margin-bottom:6px;
}
.login-sub{
  font-size:14px;color:var(--text2);margin-bottom:36px;letter-spacing:.04em;
}

/* PASSWORD INPUT */
.password-wrap{
  width:100%;max-width:300px;
  display:flex;flex-direction:column;align-items:center;gap:16px;
}
.password-field-wrap{
  width:100%;position:relative;
}
.password-input{
  width:100%;
  padding:16px 50px 16px 20px;
  border-radius:50px;
  border:2px solid var(--pink-mid);
  background:var(--white);
  font-size:24px;
  font-family:'DM Sans',sans-serif;
  color:var(--text);
  outline:none;
  text-align:center;
  letter-spacing:6px;
  transition:border-color .2s, box-shadow .2s;
  box-shadow:0 2px 16px rgba(255,45,85,0.08);
}
.password-input:focus{
  border-color:var(--pink);
  box-shadow:0 2px 20px rgba(255,45,85,0.18);
}
.password-input::placeholder{
  font-size:14px;letter-spacing:.04em;color:var(--text3);
}
.toggle-eye{
  position:absolute;right:18px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;
  font-size:20px;color:var(--text3);
  padding:4px;
}
.btn-valider{
  width:100%;
  padding:15px;
  border-radius:50px;
  border:none;
  background:var(--pink);
  color:var(--white);
  font-size:16px;
  font-weight:600;
  font-family:'DM Sans',sans-serif;
  cursor:pointer;
  letter-spacing:.04em;
  box-shadow:0 4px 20px rgba(255,45,85,0.35);
  transition:all .15s;
}
.btn-valider:active{transform:scale(0.97);opacity:.9;}

.login-error{
  font-size:13px;color:var(--pink);margin-top:4px;
  min-height:18px;text-align:center;
  font-style:italic;
}

/* ── MAIN ── */
#main-screen{
  position:fixed;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--pink-bg);
  padding:2rem 1.5rem;
  opacity:0;pointer-events:none;
  transition:opacity .6s ease .1s;
  overflow:hidden;
}
#main-screen.visible{opacity:1;pointer-events:all;}

.petals{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.petal{
  position:absolute;font-size:18px;
  animation:fall linear infinite;
  opacity:.5;
}
@keyframes fall{
  0%{transform:translateY(-30px) rotate(0deg);opacity:.6;}
  100%{transform:translateY(110vh) rotate(360deg);opacity:0;}
}

.main-logo{
  margin-bottom:16px;
  animation:heartbeat 2s ease-in-out infinite;
}
.main-logo svg{
  width:64px;height:64px;
  filter:drop-shadow(0 4px 12px rgba(255,45,85,0.3));
}

.date-badge{
  background:var(--white);
  border:1px solid var(--pink-mid);
  border-radius:20px;
  padding:5px 14px;
  font-size:12px;color:var(--text2);
  margin-bottom:28px;
  letter-spacing:.04em;
}

.message-card{
  background:var(--white);
  border-radius:24px;
  padding:32px 28px;
  text-align:center;
  box-shadow:0 4px 32px rgba(255,45,85,0.12);
  max-width:320px;
  width:100%;
  position:relative;
  overflow:hidden;
}
.message-card::before{
  content:'';
  position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,var(--pink),var(--pink-l));
}
.message-label{
  font-size:10px;font-weight:500;color:var(--text3);
  text-transform:uppercase;letter-spacing:.1em;
  margin-bottom:14px;
}
.message-text{
  font-family:'Playfair Display',serif;
  font-size:26px;
  color:var(--text);
  line-height:1.4;
  font-style:italic;
}
.message-emoji{
  font-size:32px;margin-top:16px;
  animation:bounce .8s ease infinite alternate;
}
@keyframes bounce{from{transform:translateY(0);}to{transform:translateY(-6px);}}

.main-footer{
  margin-top:28px;font-size:13px;color:var(--text3);text-align:center;
}
.btn-lock{
  margin-top:20px;
  padding:8px 20px;border-radius:20px;
  border:1px solid var(--pink-mid);
  background:transparent;
  font-size:12px;color:var(--text2);
  cursor:pointer;font-family:'DM Sans',sans-serif;
  transition:all .15s;
}
.btn-lock:hover{background:var(--pink-mid);}

.trip-badge{
  display:none;
  background:linear-gradient(135deg,var(--pink) 0%,var(--pink-l) 100%);
  color:var(--white);
  border-radius:20px;
  padding:5px 16px;
  font-size:12px;font-weight:500;letter-spacing:.03em;
  margin-top:-20px;margin-bottom:26px;
  box-shadow:0 3px 12px rgba(255,45,85,0.28);
}
.trip-badge.on{display:block;}
</style>

const PASSWORD = 'Loustic';

// ── Sejour en Espagne : 3 septembre → retour fin decembre ──
// Pour decaler le retour, change juste RETOUR ci-dessous (mois, jour).
const DEPART = {mois:9,  jour:3};
// Fin d'affichage du bandeau (aucune date de retour n'est annoncee a Pepette).
const FIN_BADGE = {mois:12, jour:31};

function joursEntre(a, b){
  const j = 86400000;
  return Math.round((Date.UTC(b.getFullYear(),b.getMonth(),b.getDate())
                   - Date.UTC(a.getFullYear(),a.getMonth(),a.getDate())) / j);
}

// Renvoie le texte du bandeau, ou '' hors periode.
function getTripBadge(now){
  const an = now.getFullYear();
  const depart = new Date(an, DEPART.mois-1, DEPART.jour);
  const fin    = new Date(an, FIN_BADGE.mois-1, FIN_BADGE.jour);
  const avantDepart = joursEntre(now, depart);

  if(avantDepart > 0){
    if(avantDepart > 14) return '';
    return avantDepart === 1 ? '🧳 Départ demain'
                             : '🧳 Départ dans ' + avantDepart + ' jours';
  }
  if(joursEntre(now, fin) < 0) return '';
  return '🇪🇸 Jour ' + (joursEntre(depart, now) + 1) + ' en Espagne';
}

function toggleEye(){
  const inp = document.getElementById('password-input');
  const btn = document.getElementById('eye-btn');
  if(inp.type === 'password'){ inp.type='text'; btn.textContent='🙈'; }
  else { inp.type='password'; btn.textContent='👁️'; }
}

function checkPassword(){
  const val = document.getElementById('password-input').value.trim();
  const errEl = document.getElementById('login-error');
  if(val.toLowerCase() === PASSWORD.toLowerCase()){
    errEl.textContent = '';
    showMain();
  } else {
    errEl.textContent = 'Essaie encore... 🥺';
    document.getElementById('password-input').value = '';
    setTimeout(()=>errEl.textContent='', 2000);
  }
}

function showMain(){
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('main-screen').classList.add('visible');
  rafraichirMessage();
  createPetals();
}

// Le message est recalcule quand l'app revient au premier plan,
// sinon un PWA laisse ouvert la nuit afficherait encore le message de la veille.
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState !== 'visible') return;
  if(!document.getElementById('main-screen').classList.contains('visible')) return;
  rafraichirMessage();
});

function rafraichirMessage(){
  document.getElementById('date-badge').textContent = formatDate();
  const badge = document.getElementById('trip-badge');
  const txtBadge = getTripBadge(new Date());
  badge.textContent = txtBadge;
  badge.classList.toggle('on', !!txtBadge);
  const msg = getTodayMessage();
  document.getElementById('msg-text').textContent = msg.txt;
  document.getElementById('msg-emoji').textContent = msg.e;
}

function lock(){
  document.getElementById('password-input').value = '';
  document.getElementById('password-input').type = 'password';
  document.getElementById('eye-btn').textContent = '👁️';
  document.getElementById('login-screen').classList.remove('hidden');
  document.getElementById('main-screen').classList.remove('visible');
  document.getElementById('login-error').textContent = '';
}

function formatDate(){
  const now = new Date();
  return now.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
}

function getTodayMessage(){
  const now = new Date();
  const mm = String(now.getMonth()+1).padStart(2,'0');
  const dd = String(now.getDate()).padStart(2,'0');
  const key = mm+'-'+dd;
  const found = MESSAGES.find(m=>m.d===key);
  if(found) return found;
  const start = new Date(now.getFullYear(),0,0);
  const dayOfYear = Math.floor((now - start) / 86400000);
  return MESSAGES[dayOfYear % MESSAGES.length];
}

function createPetals(){
  const container = document.getElementById('petals');
  container.innerHTML='';
  const emojis=['🌸','💕','✨','🌷','💗','🌹','💖'];
  for(let i=0;i<16;i++){
    const p=document.createElement('div');
    p.className='petal';
    p.textContent=emojis[Math.floor(Math.random()*emojis.length)];
    p.style.left=Math.random()*100+'%';
    p.style.fontSize=(12+Math.random()*12)+'px';
    p.style.animationDuration=(6+Math.random()*8)+'s';
    p.style.animationDelay=(-Math.random()*8)+'s';
    container.appendChild(p);
  }
}
