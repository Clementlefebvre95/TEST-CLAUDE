<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Mon Livre de Recettes</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#8c5a2b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Mes Recettes" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
</head>
<body>

  <header class="topbar">
    <button id="btn-home" class="icon-btn" title="Sommaire">📖</button>
    <h1 id="page-title">Mon Livre de Recettes</h1>
    <button id="btn-new" class="icon-btn primary" title="Nouvelle recette">＋</button>
  </header>

  <main>

    <!-- ========== SOMMAIRE ========== -->
    <section id="view-home" class="view active">
      <div class="search-wrap">
        <input type="search" id="search" placeholder="🔎 Chercher une recette…" autocomplete="off" />
      </div>

      <div id="search-results" class="hidden"></div>

      <div id="summary">
        <h2 class="section-title">Sommaire</h2>
        <div id="category-grid" class="category-grid"></div>

        <div id="recent-block" class="recent-block"></div>
      </div>
    </section>

    <!-- ========== LISTE D'UNE CATEGORIE ========== -->
    <section id="view-category" class="view">
      <div id="category-header"></div>
      <div id="category-list" class="recipe-list"></div>
    </section>

    <!-- ========== DETAIL RECETTE ========== -->
    <section id="view-recipe" class="view">
      <article id="recipe-detail" class="recipe-detail"></article>
    </section>

    <!-- ========== EDITEUR ========== -->
    <section id="view-edit" class="view">
      <form id="recipe-form" class="card" autocomplete="off">
        <input type="hidden" id="f-id" />

        <label class="field">
          <span>Titre de la recette *</span>
          <input type="text" id="f-title" required placeholder="ex : Blanquette de veau de mamie" />
        </label>

        <label class="field">
          <span>Catégorie *</span>
          <select id="f-category" required></select>
        </label>

        <div class="field-row">
          <label class="field small">
            <span>Temps</span>
            <input type="text" id="f-time" placeholder="ex : 1 h 30" />
          </label>
          <label class="field small">
            <span>Portions</span>
            <input type="text" id="f-servings" placeholder="ex : 4 pers." />
          </label>
        </div>

        <label class="field">
          <span>Ingrédients — un par ligne</span>
          <textarea id="f-ingredients" rows="8" placeholder="800 g de veau&#10;3 carottes&#10;1 oignon&#10;20 cl de crème"></textarea>
        </label>

        <label class="field">
          <span>Préparation — une étape par ligne</span>
          <textarea id="f-steps" rows="10" placeholder="Faire revenir la viande 5 min.&#10;Ajouter les légumes et couvrir d'eau.&#10;Laisser mijoter 1 h."></textarea>
        </label>

        <label class="field">
          <span>Notes / astuces</span>
          <textarea id="f-notes" rows="3" placeholder="ex : encore meilleur réchauffé le lendemain"></textarea>
        </label>

        <div class="form-actions">
          <button type="submit" class="btn primary">💾 Enregistrer</button>
          <button type="button" id="btn-cancel" class="btn ghost">Annuler</button>
        </div>
      </form>
    </section>

  </main>

  <footer class="footer">
    <button id="btn-export" class="btn tiny ghost">⬇️ Sauvegarder mes recettes</button>
    <button id="btn-import" class="btn tiny ghost">⬆️ Restaurer</button>
    <input type="file" id="import-file" accept="application/json" hidden />
  </footer>

  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
