<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mes Recettes IA</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>🍽️ Mes Recettes IA</h1>
    <nav>
      <button class="tab active" data-tab="generate">Générer</button>
      <button class="tab" data-tab="library">Bibliothèque</button>
      <button class="tab" data-tab="shopping">Courses</button>
      <button class="tab" data-tab="settings">Réglages</button>
    </nav>
  </header>

  <main>
    <!-- GENERATE -->
    <section id="generate" class="view active">
      <div class="card">
        <h2>Que veux-tu cuisiner ?</h2>

        <label class="field">
          <span>Type de cuisine</span>
          <div class="chip-row" id="cuisine-chips">
            <button class="chip" data-cuisine="Italien">🇮🇹 Italien</button>
            <button class="chip" data-cuisine="Japonais">🇯🇵 Japonais</button>
            <button class="chip" data-cuisine="Français">🇫🇷 Français</button>
            <button class="chip" data-cuisine="Indien">🇮🇳 Indien</button>
            <button class="chip" data-cuisine="Mexicain">🇲🇽 Mexicain</button>
            <button class="chip" data-cuisine="Chinois">🇨🇳 Chinois</button>
            <button class="chip" data-cuisine="Thaï">🇹🇭 Thaï</button>
            <button class="chip" data-cuisine="Libanais">🇱🇧 Libanais</button>
          </div>
          <input type="text" id="cuisine-other" placeholder="ou tape autre chose…" />
        </label>

        <label class="field">
          <span>Tes ingrédients (séparés par virgule)</span>
          <input type="text" id="ingredients" placeholder="ex: pâtes, tomate, poivron, basilic" />
          <div class="suggestions" id="ingredient-suggestions"></div>
        </label>

        <div class="field-row">
          <label class="field small">
            <span>Personnes</span>
            <input type="number" id="servings" value="2" min="1" max="12" />
          </label>
          <label class="field small">
            <span>Temps max</span>
            <select id="time-limit">
              <option value="">Pas de limite</option>
              <option value="15">15 min</option>
              <option value="30" selected>30 min</option>
              <option value="45">45 min</option>
              <option value="60">1h</option>
            </select>
          </label>
          <label class="field small">
            <span>Difficulté</span>
            <select id="difficulty">
              <option value="facile" selected>Facile</option>
              <option value="moyenne">Moyenne</option>
              <option value="experte">Experte</option>
            </select>
          </label>
        </div>

        <label class="field">
          <span>Préférences (optionnel)</span>
          <input type="text" id="preferences" placeholder="ex: végétarien, sans gluten, peu épicé…" />
        </label>

        <button id="generate-btn" class="primary">✨ Créer ma recette</button>
        <p class="hint" id="habit-hint"></p>
      </div>

      <div id="recipe-output" class="card hidden"></div>
    </section>

    <!-- LIBRARY -->
    <section id="library" class="view">
      <div class="card">
        <div class="section-head">
          <h2>Ma bibliothèque</h2>
          <button id="add-own-btn" class="secondary">+ Ajouter une recette perso</button>
        </div>
        <input type="text" id="library-search" placeholder="🔎 Rechercher…" />
        <div id="library-list"></div>
      </div>
    </section>

    <!-- SHOPPING -->
    <section id="shopping" class="view">
      <div class="card">
        <h2>Liste de courses</h2>
        <p class="hint">Sélectionne des recettes dans ta bibliothèque, puis génère une liste consolidée.</p>
        <div id="shopping-recipe-picker"></div>
        <button id="build-shopping-btn" class="primary">🛒 Générer la liste</button>
        <div id="shopping-output" class="hidden"></div>
      </div>
    </section>

    <!-- SETTINGS -->
    <section id="settings" class="view">
      <div class="card">
        <h2>Réglages</h2>
        <label class="field">
          <span>Clé API Anthropic</span>
          <input type="password" id="api-key" placeholder="sk-ant-…" />
          <small>Stockée uniquement dans ton navigateur (localStorage). Récupère-la sur console.anthropic.com.</small>
        </label>
        <label class="field">
          <span>Modèle</span>
          <select id="model">
            <option value="claude-sonnet-4-6" selected>Claude Sonnet 4.6 (recommandé)</option>
            <option value="claude-haiku-4-5-20251001">Claude Haiku 4.5 (rapide)</option>
            <option value="claude-opus-4-7">Claude Opus 4.7 (max qualité)</option>
          </select>
        </label>
        <button id="save-settings" class="primary">Enregistrer</button>
        <hr />
        <h3>Mes habitudes</h3>
        <div id="habits-display"></div>
        <button id="reset-habits" class="danger">Réinitialiser les habitudes</button>
      </div>
    </section>
  </main>

  <!-- MODAL: own recipe -->
  <div id="own-recipe-modal" class="modal hidden">
    <div class="modal-content">
      <h2>Ajouter ma recette</h2>
      <label class="field">
        <span>Titre</span>
        <input type="text" id="own-title" />
      </label>
      <label class="field">
        <span>Cuisine</span>
        <input type="text" id="own-cuisine" placeholder="ex: Italien" />
      </label>
      <label class="field">
        <span>Personnes</span>
        <input type="number" id="own-servings" value="2" min="1" max="12" />
      </label>
      <label class="field">
        <span>Ingrédients (un par ligne, format: 200g pâtes)</span>
        <textarea id="own-ingredients" rows="6"></textarea>
      </label>
      <label class="field">
        <span>Étapes (une par ligne)</span>
        <textarea id="own-steps" rows="6"></textarea>
      </label>
      <div class="row">
        <button id="save-own-btn" class="primary">Enregistrer</button>
        <button id="cancel-own-btn" class="secondary">Annuler</button>
      </div>
    </div>
  </div>

  <!-- MODAL: recipe view -->
  <div id="recipe-modal" class="modal hidden">
    <div class="modal-content" id="recipe-modal-content"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
