<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: "Baloo 2", system-ui, sans-serif; }
    a { color: #c84826; } a:hover { color: #e85d3a; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #faf7f2; display: flex; flex-direction: column; overflow: hidden;">

  <div style="display: flex; flex-direction: column; gap: 14px; padding: 16px 20px 14px; background: linear-gradient(#ffffff, #fdfbf8);">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
      <div style="display: flex; align-items: center; background: #f3ede4; border-radius: 999px; padding: 3px;">
        <div style="padding: 4px 12px; border-radius: 999px; background: #e85d3a; color: #ffffff; font-size: 12px; font-weight: 700;">Espagnol</div>
        <div style="width: 2px; height: 13px; background: #8a8079; opacity: .35; border-radius: 2px; margin: 0 4px;"></div>
        <div style="padding: 4px 12px; border-radius: 999px; color: #8a8079; font-size: 12px; font-weight: 700;">Anglais</div>
      </div>
      <svg width="18" height="4" viewBox="0 0 18 4" fill="none" aria-hidden="true"><circle cx="2" cy="2" r="1.6" fill="#b7ada4"></circle><circle cx="9" cy="2" r="1.6" fill="#b7ada4"></circle><circle cx="16" cy="2" r="1.6" fill="#b7ada4"></circle></svg>
    </div>

    <div style="display: flex; align-items: baseline; gap: 18px;">
      <div style="font-size: 20px; font-weight: 600; color: #b7ada4; line-height: 1;">Mes mots</div>
      <div style="font-size: 20px; font-weight: 600; color: #b7ada4; line-height: 1;">Du jour</div>
      <div style="display: flex; flex-direction: column; gap: 5px;">
        <div style="font-size: 24px; font-weight: 700; color: #2b2520; line-height: 1;">Révision</div>
        <div style="height: 3px; border-radius: 3px; background: #e85d3a;"></div>
      </div>
    </div>
  </div>

  <div style="display: flex; gap: 16px; padding: 18px 20px 0;">
    <div style="font-size: 14px; font-weight: 600; color: #a1978e;">Deviner le français</div>
    <div style="font-size: 14px; font-weight: 600; color: #a1978e;">Nouvelle série</div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 0 24px 40px;">

    <div style="background: #ffffff; border-radius: 28px; padding: 30px 34px; font-size: 32px; font-weight: 700; color: #2b2520; text-align: center; box-shadow: 0 2px 4px rgba(40,25,15,.04), 0 14px 34px rgba(40,25,15,.09);">la llave</div>

    <div style="background: #fde8e2; color: #c84826; border-radius: 24px; padding: 18px 28px; font-size: 23px; font-weight: 700;">la clé</div>

    <div style="display: flex; gap: 10px; margin-top: 6px;">
      <div style="background: #ffffff; border-radius: 999px; padding: 13px 26px; font-size: 16px; font-weight: 600; color: #2b2520; box-shadow: 0 1px 2px rgba(40,25,15,.04), 0 5px 14px rgba(40,25,15,.06);">À revoir</div>
      <div style="background: #e85d3a; border-radius: 999px; padding: 13px 26px; font-size: 16px; font-weight: 700; color: #ffffff; box-shadow: 0 6px 18px rgba(232,93,58,.36);">Je savais</div>
    </div>

    <div style="display: flex; align-items: center; gap: 8px; margin-top: 10px;">
      <div style="width: 22px; height: 4px; border-radius: 2px; background: #e85d3a;"></div>
      <div style="width: 22px; height: 4px; border-radius: 2px; background: #e85d3a;"></div>
      <div style="width: 22px; height: 4px; border-radius: 2px; background: #e6ddd2;"></div>
      <div style="width: 22px; height: 4px; border-radius: 2px; background: #e6ddd2;"></div>
      <div style="width: 22px; height: 4px; border-radius: 2px; background: #e6ddd2;"></div>
      <div style="font-size: 13px; font-weight: 600; color: #a1978e; margin-left: 6px;">3 / 12</div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
