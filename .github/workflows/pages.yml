name: Deploy recipe book to GitHub Pages

on:
  push:
    branches: [claude/recipe-book-app-oiv1jj]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Étape 1 : activer Pages (crée l'environnement github-pages si besoin)
  # et préparer le contenu du site. Pas d'environnement déclaré ici, sinon
  # le job est refusé avant d'avoir pu activer Pages.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  # Étape 2 : publier.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
